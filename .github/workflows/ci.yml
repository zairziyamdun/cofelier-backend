name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # postinstall запускает prisma generate.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cofelier
          POSTGRES_PASSWORD: cofelier
          # e2e идут только в базу с именем на _test (src/config/test-database.ts).
          POSTGRES_DB: cofelier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cofelier -d cofelier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cofelier:cofelier@localhost:5432/cofelier_test?schema=public
      NODE_ENV: test
      # Только для тестовой БД в CI; на сервере — свой секрет.
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # test:e2e сам применяет миграции и сиды (test/prepare-e2e-db.ts).
      - run: pnpm test:e2e
