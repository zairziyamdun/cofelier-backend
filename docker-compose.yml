# Разработка: `docker compose up -d db storage` — база и хранилище фото,
# API — `pnpm start:dev`.
# Целиком в контейнерах: `docker compose up -d --build`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cofelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cofelier}
      POSTGRES_DB: ${POSTGRES_DB:-cofelier}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Хранилище фото меню — S3-совместимое (RustFS), как Cloudflare R2 на проде.
  # Бакет с открытым чтением создаёт API при старте вне прода (storage.service.ts).
  # Консоль: http://localhost:9001, логин и пароль — S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-cofelier}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-cofelier-storage}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cofelier}:${POSTGRES_PASSWORD:-cofelier}@db:5432/${POSTGRES_DB:-cofelier}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
  storage-data:
