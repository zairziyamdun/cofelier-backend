# Разработка: `docker compose up -d db` — только PostgreSQL, API — `pnpm start:dev`.
# Целиком в контейнерах: `docker compose up -d --build`.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cofelier}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cofelier}
      POSTGRES_DB: ${POSTGRES_DB:-cofelier}
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-cofelier}:${POSTGRES_PASSWORD:-cofelier}@db:5432/${POSTGRES_DB:-cofelier}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
